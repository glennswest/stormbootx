[package]
name = "stormbootx"
description = "UEFI NVMe/TCP boot extension: claim an image by service tag and publish it as EFI_BLOCK_IO_PROTOCOL"
version = "0.21.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "stormbootx"
path = "src/main.rs"

# The diagnostic that answers "will stormbootx run on this server model?"
# before anyone writes a stick. Shares tcp4.rs by path rather than through a
# library crate: a UEFI binary is `no_main`/`no_std` and there is exactly one
# module to share.
[[bin]]
name = "tcp4probe"
path = "src/tcp4probe.rs"

# Who can read a 4096-byte-sector ESP: the firmware's FAT, and stormbootx's
# own reader (#37). Boots under OVMF in tests/esp-ovmf.sh.
[[bin]]
name = "espprobe"
path = "src/espprobe.rs"

[dependencies]
uefi = { version = "0.39", features = ["alloc", "global_allocator", "panic_handler", "logger"] }
uefi-raw = "0.15"
# stormbootx's own TCP/IP, on the NIC driver's SNP (#56): DHCP, ARP and TCP,
# and UDP for one SNTP exchange and its DNS lookup (#77). The firmware's
# EFI_TCP4 is not used.
# Verify-only Ed25519 for the self-update's signed manifest (#83): an audited
# no_std crate with no dependencies once its defaults are off, never crypto
# written here. Nothing in this binary signs.
ed25519-compact = { version = "2.6", default-features = false, features = ["opt_size"] }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dhcpv4"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
